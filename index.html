<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة المنتجات والأطياب</title>
  <style>
    :root {
      --bg-color: #0f0d0b;
      --card-bg: #1a1612;
      --accent-color: #d4af37;
      --accent-hover: #b59228;
      --text-color: #f5f5f5;
      --danger-color: #ff4d4d;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
      direction: rtl;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    }

    h2, h3 {
      color: var(--accent-color);
      margin-bottom: 15px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #25201b;
      color: #fff;
      box-sizing: border-box;
      font-size: 15px;
    }

    .btn {
      width: 100%;
      background: var(--accent-color);
      color: #000;
      font-weight: bold;
      padding: 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.3s;
    }

    .btn:hover {
      background: var(--accent-hover);
    }

    .btn-delete {
      background: var(--danger-color);
      color: white;
      padding: 6px 15px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    /* قائمة المنتجات */
    .product-list {
      margin-top: 25px;
    }

    .product-item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #25201b;
      padding: 12px 20px;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    /* كروت العرض */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .product-card {
      background: #25201b;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #333;
      position: relative;
    }

    .product-card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      cursor: pointer;
      transition: transform 0.3s, filter 0.3s;
    }

    .product-card img:hover {
      transform: scale(1.03);
      filter: brightness(1.1);
    }

    .product-info {
      padding: 15px;
    }

    .product-title {
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 8px;
    }

    .badge-new {
      position: absolute;
      top: 10px;
      right: 10px;
      background: var(--accent-color);
      color: #000;
      padding: 3px 10px;
      border-radius: 15px;
      font-size: 12px;
      font-weight: bold;
    }

    /* Modal / Lightbox لتكبير الصورة */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      justify-content: center;
      align-items: center;
    }

    .modal img {
      max-width: 90%;
      max-height: 85%;
      border-radius: 8px;
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.4);
    }

    .modal .close-btn {
      position: absolute;
      top: 20px;
      left: 30px;
      color: #fff;
      font-size: 35px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>إضافة المنتج والسحبيات</h2>
    
    <div class="form-group">
      <label>اسم المنتج:</label>
      <input type="text" id="prodName" placeholder="مثال: تيجان 5 ساعات">
    </div>

    <div class="form-group">
      <label>السعر (ج.م):</label>
      <input type="number" id="prodPrice" placeholder="مثال: 65">
    </div>

    <div class="form-group">
      <label>رابط الصورة (URL):</label>
      <input type="text" id="prodImg" placeholder="ضع رابط الصورة هنا">
    </div>

    <!-- زر الحفظ والإضافة -->
    <button class="btn" onclick="saveProduct()">إضافة وحفظ النكهة سحابياً</button>

    <!-- قائمة إدارة المنتجات -->
    <div class="product-list">
      <h3>إدارة وحذف المنتجات الحالية:</h3>
      <div id="manageList"></div>
    </div>

    <!-- عرض المنتجات ككروت -->
    <h3>المنتجات المعروضة:</h3>
    <div class="products-grid" id="cardsGrid"></div>
  </div>

  <!-- النافذة المنبثقة للتكبير عند الضغط على الصورة -->
  <div class="modal" id="imageModal" onclick="closeModal()">
    <span class="close-btn">&times;</span>
    <img id="modalImg" src="" alt="صورة مكبرة">
  </div>

  <script>
    // 1. تحميل المنتجات من التخزين المحلي عند فتح الصفحة (يمنع الاختفاء بعد الريفريش)
    let products = JSON.parse(localStorage.getItem('myProducts')) || [];

    // عند تحميل الصفحة
    window.onload = function() {
      renderProducts();
    };

    // 2. دالة حفظ المنتج
    function saveProduct() {
      const name = document.getElementById('prodName').value.trim();
      const price = document.getElementById('prodPrice').value.trim();
      const img = document.getElementById('prodImg').value.trim();

      if (!name || !price) {
        alert('الرجاء كتابة اسم المنتج والسعر على الأقل!');
        return;
      }

      const newProduct = {
        id: Date.now(),
        name: name,
        price: price,
        img: img || 'https://via.placeholder.com/300x300?text=لا+توجد+صورة'
      };

      products.push(newProduct);
      
      // حفظ في localstorage
      localStorage.setItem('myProducts', JSON.stringify(products));

      // تفريغ المدخلات
      document.getElementById('prodName').value = '';
      document.getElementById('prodPrice').value = '';
      document.getElementById('prodImg').value = '';

      renderProducts();
    }

    // 3. دالة حذف المنتج
    function deleteProduct(id) {
      products = products.filter(p => p.id !== id);
      localStorage.setItem('myProducts', JSON.stringify(products));
      renderProducts();
    }

    // 4. رسم وعرض المنتجات في القائمة والكروت
    function renderProducts() {
      const manageList = document.getElementById('manageList');
      const cardsGrid = document.getElementById('cardsGrid');

      manageList.innerHTML = '';
      cardsGrid.innerHTML = '';

      products.forEach(p => {
        // إضافة لقائمة الإدارة
        manageList.innerHTML += `
          <div class="product-item-row">
            <span>${p.name} (${p.price} ج.م)</span>
            <button class="btn-delete" onclick="deleteProduct(${p.id})">حذف</button>
          </div>
        `;

        // إضافة لكروت العرض
        cardsGrid.innerHTML += `
          <div class="product-card">
            <span class="badge-new">جديد</span>
            <img src="${p.img}" alt="${p.name}" onclick="openModal('${p.img}')">
            <div class="product-info">
              <div class="product-title">${p.name}</div>
              <div>السعر: ${p.price} ج.م</div>
            </div>
          </div>
        `;
      });
    }

    // 5. جافا سكريبت لتكبير الصورة عند الضغط عليها (Modal / LightBox)
    function openModal(imgSrc) {
      const modal = document.getElementById('imageModal');
      const modalImg = document.getElementById('modalImg');
      modalImg.src = imgSrc;
      modal.style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('imageModal').style.display = 'none';
    }
  </script>
</body>
</html>
